<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c8b6f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>WEEKLY TRAINING CARTRIDGE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --shell: #7c8b6f;
  --shell-dark: #5c6952;
  --shell-darker: #454f3d;
  --screen-bg: #9bbc0f;
  --screen-dark: #0f380f;
  --screen-mid: #306230;
  --screen-light: #8bac0f;
  --accent-red: #c0392b;
  --accent-amber: #d68910;
  --paper: #e8f0d0;
  --font-pixel: 'Press Start 2P', monospace;
  --font-mono: 'VT323', monospace;
}

*{box-sizing:border-box;}
body{margin:0;padding:16px;background:transparent;display:flex;justify-content:center;font-family:var(--font-mono);}

.console{
  width:100%;
  max-width:460px;
  background:linear-gradient(180deg,var(--shell),var(--shell-dark));
  border-radius:18px;
  padding:18px 16px 22px;
  box-shadow:0 8px 0 var(--shell-darker), 0 10px 20px rgba(0,0,0,.4);
  border:3px solid var(--shell-darker);
}

.console-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 4px 12px;
}
.console-title{
  font-family:var(--font-pixel);
  color:var(--screen-dark);
  font-size:10px;
  letter-spacing:1px;
  background:var(--shell-darker);
  padding:4px 8px;
  border-radius:4px;
  color:#dfe8c8;
}
.power-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--accent-red);
  box-shadow:0 0 6px var(--accent-red);
  animation:blink 2.4s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

.screen-frame{
  background:var(--shell-darker);
  border-radius:10px;
  padding:10px;
  box-shadow: inset 0 0 0 3px #3a4232;
}

.screen{
  background:var(--screen-bg);
  border-radius:4px;
  padding:12px;
  min-height:420px;
  position:relative;
  overflow:hidden;
  box-shadow: inset 0 0 30px rgba(15,56,15,.35);
}
.scanlines{
  pointer-events:none;
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(15,56,15,0.08),
    rgba(15,56,15,0.08) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode:multiply;
}

.hud{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  color:var(--screen-dark);
  font-family:var(--font-pixel);
  font-size:9px;
  margin-bottom:8px;
  position:relative;
}
.hud .streak{color:var(--screen-dark);}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin-bottom:10px;
  position:relative;
}
.cal-day{
  text-align:center;
  font-family:var(--font-pixel);
  font-size:8px;
  color:var(--screen-dark);
  cursor:pointer;
  padding:4px 0;
  border-radius:3px;
  background:rgba(15,56,15,0.08);
  border:2px solid transparent;
}
.cal-day.today{border-color:var(--screen-dark);}
.cal-day.active{background:var(--screen-mid);color:var(--paper);}
.cal-day .stamp{display:block;font-size:12px;margin-top:2px;}

.day-title{
  font-family:var(--font-pixel);
  font-size:12px;
  color:var(--screen-dark);
  margin:10px 0 4px;
  position:relative;
}
.day-sub{
  font-size:16px;
  color:var(--screen-mid);
  margin-bottom:10px;
  position:relative;
  line-height:1.3;
}

.exercise-card{
  background:rgba(15,56,15,0.08);
  border:2px solid var(--screen-mid);
  border-radius:6px;
  padding:8px 10px;
  margin-bottom:8px;
  position:relative;
}
.ex-top{display:flex;align-items:center;gap:8px;}
.ex-icon{flex-shrink:0;}
.ex-name{
  font-family:var(--font-pixel);
  font-size:9px;
  color:var(--screen-dark);
  line-height:1.5;
}
.ex-target{
  font-size:15px;
  color:var(--screen-mid);
  margin-left:auto;
  text-align:right;
  white-space:nowrap;
}
.ex-how{
  font-size:14px;
  line-height:1.3;
  color:var(--screen-mid);
  margin:4px 0 2px 36px;
}
.ex-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:6px;
}
.sets{display:flex;gap:5px;}
.set-box{
  width:20px;height:20px;
  border:2px solid var(--screen-dark);
  cursor:pointer;
  background:transparent;
  border-radius:2px;
}
.set-box.done{background:var(--screen-dark);}
.rest-btn{
  font-family:var(--font-pixel);
  font-size:7px;
  background:var(--accent-amber);
  color:var(--paper);
  border:none;
  border-radius:3px;
  padding:5px 6px;
  cursor:pointer;
}
.rest-btn:active{transform:translateY(1px);}

.note-box{
  font-size:15px;
  color:var(--screen-dark);
  background:rgba(15,56,15,0.08);
  border-left:4px solid var(--screen-mid);
  padding:6px 8px;
  margin:8px 0;
  border-radius:2px;
}

.walk-block{
  text-align:center;
  padding:18px 0 6px;
  position:relative;
}
.big-check{
  font-family:var(--font-pixel);
  font-size:10px;
  background:var(--screen-mid);
  color:var(--paper);
  border:none;
  border-radius:5px;
  padding:12px 14px;
  cursor:pointer;
  margin-top:14px;
}
.big-check.done{background:var(--screen-dark);}

.toast{
  position:absolute;
  left:8px;right:8px;bottom:8px;
  background:var(--screen-dark);
  color:var(--paper);
  font-family:var(--font-pixel);
  font-size:9px;
  text-align:center;
  padding:10px;
  border-radius:4px;
  opacity:0;
  transform:translateY(10px);
  transition:all .3s ease;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}

.timer-overlay{
  position:absolute;inset:0;
  background:rgba(15,56,15,.95);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:var(--paper);
  font-family:var(--font-pixel);
  z-index:10;
}
.timer-overlay.show{display:flex;}
.timer-num{font-size:36px;margin-bottom:14px;}
.timer-bar-bg{width:80%;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin-bottom:16px;}
.timer-bar{height:100%;background:var(--screen-light);width:100%;}
.timer-skip{
  font-family:var(--font-pixel);
  font-size:8px;
  background:var(--accent-red);
  color:var(--paper);
  border:none;
  border-radius:4px;
  padding:8px 10px;
  cursor:pointer;
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 6px 0;
}
.dpad-btn{
  font-family:var(--font-pixel);
  font-size:8px;
  background:var(--shell-darker);
  color:#dfe8c8;
  border:2px solid #2f3629;
  border-radius:6px;
  padding:8px 10px;
  cursor:pointer;
}
.dpad-btn:active{transform:translateY(1px);}
.ab-buttons{display:flex;gap:8px;}
.ab-btn{
  width:38px;height:38px;
  border-radius:50%;
  border:2px solid var(--accent-red);
  background:#a93226;
  color:#f6e6e2;
  font-family:var(--font-pixel);
  font-size:9px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}

svg{display:block;}
</style>
</head>
<body>

<div class="console">
  <div class="console-header">
    <span class="console-title">TRAINING CARTRIDGE</span>
    <span class="power-dot"></span>
  </div>

  <div class="screen-frame">
    <div class="screen" id="screen">
      <div class="scanlines"></div>

      <div class="hud">
        <span>WK PROGRESS</span>
        <span class="streak" id="streakLabel">STREAK: 0</span>
      </div>

      <div class="calendar" id="calendar"></div>

      <div id="dayContent"></div>

      <div class="toast" id="toast">DAY COMPLETE!</div>
      <div class="timer-overlay" id="timerOverlay">
        <div style="font-size:8px;margin-bottom:10px;">REST</div>
        <div class="timer-num" id="timerNum">60</div>
        <div class="timer-bar-bg"><div class="timer-bar" id="timerBar"></div></div>
        <button class="timer-skip" id="timerSkip">SKIP</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="dpad-btn" id="prevDay">◀ PREV</button>
    <div class="ab-buttons">
      <button class="ab-btn" id="resetBtn" title="Reset this day">R</button>
    </div>
    <button class="dpad-btn" id="nextDay">NEXT ▶</button>
  </div>
</div>

<script>
// ---------- Icon patterns (8x8 pixel grids, 1 = filled) ----------
const ICONS = {
  squat: ["00111000","01111100","01000100","01111100","01000100","01000100","01100110","01100110"],
  hinge: ["00011000","00111000","01111100","00110100","00100100","00100100","01100110","01100110"],
  press: ["10000010","11000110","01111100","00111000","00111000","00101000","00101000","00101000"],
  row:   ["00011000","00011000","01111110","10011001","00011000","00011000","00100100","01000010"],
  push:  ["00000000","01111110","10011001","01111110","00100100","01011010","10000001","00000000"],
  lunge: ["00110000","00110000","00110000","00111100","00100010","00100010","00010000","00011000"],
  core:  ["00111100","01000010","10111101","10011001","10111101","01000010","00111100","00000000"],
  throw: ["01000010","01100110","00111100","00011000","00111100","01000010","10000001","00000000"],
  raise: ["00010000","10011001","11011011","00110000","00110000","00110000","01100110","01100110"],
  walk:  ["00110000","00110000","00111000","01111000","00110100","01100010","01000010","10000001"],
  hip90: ["00000000","00111000","01000100","01000100","00111000","00011100","00100010","01000010"],
  firehydrant: ["00000000","00110000","00111100","01001010","01001001","00111001","00000000","00000000"],
  pigeon: ["00000000","01111000","10000100","10011100","01100000","00110000","00011000","00001100"]
};

function iconSVG(name, size=32){
  const grid = ICONS[name] || ICONS.core;
  let rects = "";
  const cell = size/8;
  for(let y=0;y<8;y++){
    for(let x=0;x<8;x++){
      if(grid[y][x]==="1"){
        rects += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="var(--screen-dark)"/>`;
      }
    }
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rects}</svg>`;
}

// ---------- Weekly plan ----------
// getDay(): 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
const PLAN = {
  1: { // Monday - Strength A
    type:"strength", label:"MON · STRENGTH A", sub:"Full body — lower + push focus",
    warmup:"Warm-up: 5 min — bodyweight squats, arm circles, cat-cow (mat)",
    cooldown:"Cool-down: 5 min — hamstring, quad, chest stretch on mat",
    exercises:[
      {id:"a1", name:"Goblet Squat", icon:"squat", target:"3 × 12", sets:3, how:"Hold a dumbbell vertically at your chest. Squat down keeping your chest up, then drive through your heels to stand."},
      {id:"a2", name:"Bent-Over DB Row", icon:"row", target:"3 × 12/side", sets:3, how:"Hinge forward with a flat back. Pull the dumbbell to your hip, squeeze your shoulder blade, lower with control."},
      {id:"a3", name:"DB Shoulder Press", icon:"press", target:"3 × 12", sets:3, how:"Press dumbbells overhead from shoulder height until arms are straight, then lower slowly."},
      {id:"a4", name:"Med Ball Russian Twist", icon:"core", target:"3 × 20", sets:3, how:"Sit with knees bent, lean back slightly, and rotate the ball side to side, tapping the floor."},
      {id:"a5", name:"Glute Bridge", icon:"hinge", target:"3 × 15", sets:3, how:"Lie on your back, knees bent, feet flat. Drive your hips up, squeeze your glutes, lower with control."},
      {id:"a6", name:"Plank Hold", icon:"core", target:"3 × 30 sec", sets:3, how:"Forearms on the mat, body in a straight line from head to heels. Brace your core, don't let hips sag."}
    ]
  },
  2: { // Tuesday - walk
    type:"walk", label:"TUE · WALK + HIP MOBILITY", sub:"30–40 min walk, easy pace",
    note:"After your walk — hip mobility flow (great for a 39-y/o training body):",
    mobility:[
      {id:"m1", name:"90/90 Hip Switch", icon:"hip90", target:"2 × 8/side", sets:2, how:"Sit with your front leg bent 90° in front of you and back leg bent 90° to the side. Rotate both knees to the other side and back."},
      {id:"m2", name:"World's Greatest Stretch", icon:"lunge", target:"2 × 5/side", sets:2, how:"From a deep lunge, drop your back hand to the floor and rotate your other arm up toward the ceiling, following it with your eyes."},
      {id:"m3", name:"Deep Squat Hold", icon:"squat", target:"2 × 30 sec", sets:2, how:"Lower into a full squat, heels down, elbows pressing your knees outward. Hold and breathe."}
    ]
  },
  3: { // Wednesday - Strength B
    type:"strength", label:"WED · STRENGTH B", sub:"Full body — hinge + core focus",
    warmup:"Warm-up: 5 min — leg swings, shoulder rolls, glute bridges x10",
    cooldown:"Cool-down: 5 min — child's pose, quad stretch, chest opener",
    exercises:[
      {id:"b1", name:"DB Romanian Deadlift", icon:"hinge", target:"3 × 12", sets:3, how:"Hinge at the hips with a slight knee bend, lower dumbbells along your legs until you feel a hamstring stretch, then drive hips forward to stand."},
      {id:"b2", name:"Push-Up", icon:"push", target:"3 × 10–15", sets:3, how:"Hands under shoulders, lower your chest to the floor keeping your body straight, push back up. Drop to knees if needed."},
      {id:"b3", name:"DB Reverse Lunge", icon:"lunge", target:"3 × 10/leg", sets:3, how:"Step one leg back, lower until both knees are near 90°, push through your front heel to return to standing."},
      {id:"b4", name:"Med Ball Slam", icon:"throw", target:"3 × 12", sets:3, how:"Raise the ball overhead, slam it down hard into the floor, squat to retrieve it and repeat."},
      {id:"b5", name:"DB Curl to Press", icon:"press", target:"3 × 12", sets:3, how:"Curl the dumbbells to your shoulders, then press overhead in one smooth motion."},
      {id:"b6", name:"Side Plank", icon:"core", target:"3 × 20 sec/side", sets:3, how:"Prop up on one forearm, stack your feet, lift your hips so your body forms a straight line."}
    ]
  },
  4: { // Thursday - walk
    type:"walk", label:"THU · WALK + HIP MOBILITY", sub:"30–40 min walk, easy pace",
    note:"Feeling good? Add a few brisk intervals: 1 min fast / 2 min easy. Then:",
    mobility:[
      {id:"m4", name:"Fire Hydrant", icon:"firehydrant", target:"2 × 12/side", sets:2, how:"On hands and knees, lift one bent knee out to the side, keeping your hips square. Lower with control."},
      {id:"m5", name:"Cossack Squat", icon:"lunge", target:"2 × 8/side", sets:2, how:"Wide stance, shift your weight into one bent knee while the other leg stays straight. Alternate sides."},
      {id:"m6", name:"Pigeon Stretch", icon:"pigeon", target:"2 × 30 sec/side", sets:2, how:"Front shin angled across the mat, back leg extended straight behind you. Fold forward gently over the front leg."}
    ]
  },
  5: { // Friday - Strength C
    type:"strength", label:"FRI · STRENGTH C", sub:"Full body — legs + shoulders focus",
    warmup:"Warm-up: 5 min — bodyweight squats, band-free arm circles, torso twists",
    cooldown:"Cool-down: 5 min — figure-4 stretch, lat stretch, deep breathing",
    exercises:[
      {id:"c1", name:"DB Sumo Squat", icon:"squat", target:"3 × 15", sets:3, how:"Wide stance, toes turned out, hold a dumbbell with both hands and squat down between your legs."},
      {id:"c2", name:"Single-Arm DB Row", icon:"row", target:"3 × 12/side", sets:3, how:"Support yourself with one hand on a bench or chair, row the dumbbell to your hip with the other."},
      {id:"c3", name:"Med Ball Overhead Throw", icon:"throw", target:"3 × 12", sets:3, how:"Lower into a squat holding the ball, explode up and throw it overhead or forward."},
      {id:"c4", name:"DB Lateral Raise", icon:"raise", target:"3 × 12", sets:3, how:"Raise dumbbells out to your sides until arms are level with shoulders, lower slowly."},
      {id:"c5", name:"Mat Bicycle Crunch", icon:"core", target:"3 × 20", sets:3, how:"Lie on your back, alternate bringing opposite elbow to opposite knee in a pedaling motion."},
      {id:"c6", name:"Bird Dog", icon:"core", target:"3 × 10/side", sets:3, how:"On hands and knees, extend opposite arm and leg, hold briefly, return and switch sides."}
    ]
  },
  6: { // Saturday - active recovery
    type:"walk", label:"SAT · ACTIVE RECOVERY", sub:"20–30 min easy walk + stretch",
    note:"Keep it light. This day is about recovery, not effort. Full hip flow:",
    mobility:[
      {id:"m7", name:"90/90 Hip Switch", icon:"hip90", target:"2 × 8/side", sets:2, how:"Sit with your front leg bent 90° in front of you and back leg bent 90° to the side. Rotate both knees to the other side and back."},
      {id:"m8", name:"Fire Hydrant", icon:"firehydrant", target:"2 × 12/side", sets:2, how:"On hands and knees, lift one bent knee out to the side, keeping your hips square. Lower with control."},
      {id:"m9", name:"World's Greatest Stretch", icon:"lunge", target:"2 × 5/side", sets:2, how:"From a deep lunge, drop your back hand to the floor and rotate your other arm up toward the ceiling, following it with your eyes."},
      {id:"m10", name:"Pigeon Stretch", icon:"pigeon", target:"2 × 30 sec/side", sets:2, how:"Front shin angled across the mat, back leg extended straight behind you. Fold forward gently over the front leg."}
    ]
  },
  0: { // Sunday - rest
    type:"walk", label:"SUN · REST", sub:"Full rest, or a short gentle walk",
    note:"Rest is part of the plan — your muscles rebuild on days like this."
  }
};

const DAY_LETTERS = ["S","M","T","W","T","F","S"];

// ---------- State ----------
let selectedDow = new Date().getDay();
let weekData = {}; // dateStr -> {completedSets:[], dayComplete:bool}
let weekDates = [];

function pad(n){return n<10?"0"+n:""+n;}
function toDateStr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}

function getWeekDates(){
  const today = new Date();
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - today.getDay());
  const arr = [];
  for(let i=0;i<7;i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    arr.push(d);
  }
  return arr;
}

async function loadWeek(){
  weekDates = getWeekDates();
  for(const d of weekDates){
    const key = "log:" + toDateStr(d);
    try{
      const raw = localStorage.getItem(key);
      weekData[toDateStr(d)] = raw ? JSON.parse(raw) : {completedSets:[], dayComplete:false};
    }catch(e){
      weekData[toDateStr(d)] = {completedSets:[], dayComplete:false};
    }
  }
}

async function saveDay(dateStr){
  try{
    localStorage.setItem("log:" + dateStr, JSON.stringify(weekData[dateStr]));
  }catch(e){ console.error("save failed", e); }
}

function computeStreak(){
  let streak = 0;
  const dates = [...weekDates].reverse();
  for(const d of dates){
    if(d > new Date()) continue;
    const data = weekData[toDateStr(d)];
    if(data && data.dayComplete) streak++;
    else break;
  }
  return streak;
}

// ---------- Rendering ----------
function renderCalendar(){
  const cal = document.getElementById("calendar");
  const todayStr = toDateStr(new Date());
  cal.innerHTML = weekDates.map((d,i)=>{
    const dateStr = toDateStr(d);
    const data = weekData[dateStr];
    const isToday = dateStr === todayStr;
    const isActive = d.getDay() === selectedDow;
    const stamp = data && data.dayComplete ? "✓" : "·";
    return `<div class="cal-day ${isToday?'today':''} ${isActive?'active':''}" data-dow="${d.getDay()}">
      ${DAY_LETTERS[d.getDay()]}<span class="stamp">${stamp}</span>
    </div>`;
  }).join("");
  cal.querySelectorAll(".cal-day").forEach(el=>{
    el.addEventListener("click", ()=>{
      selectedDow = parseInt(el.dataset.dow);
      renderAll();
    });
  });
  document.getElementById("streakLabel").textContent = "STREAK: " + computeStreak();
}

function currentDateStrForDow(dow){
  const d = weekDates.find(d=>d.getDay()===dow);
  return toDateStr(d);
}

function renderDay(){
  const plan = PLAN[selectedDow];
  const dateStr = currentDateStrForDow(selectedDow);
  const data = weekData[dateStr];
  const container = document.getElementById("dayContent");

  if(plan.type === "strength"){
    const exHTML = plan.exercises.map(ex=>{
      const setsHTML = Array.from({length: ex.sets}).map((_,i)=>{
        const setKey = `${ex.id}-${i}`;
        const done = data.completedSets.includes(setKey);
        return `<div class="set-box ${done?'done':''}" data-setkey="${setKey}"></div>`;
      }).join("");
      return `
        <div class="exercise-card">
          <div class="ex-top">
            <div class="ex-icon">${iconSVG(ex.icon,28)}</div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-target">${ex.target}</div>
          </div>
          ${ex.how ? `<div class="ex-how">${ex.how}</div>` : ""}
          <div class="ex-bottom">
            <div class="sets">${setsHTML}</div>
            <button class="rest-btn" data-rest="60">REST 60s</button>
          </div>
        </div>`;
    }).join("");

    container.innerHTML = `
      <div class="day-title">${plan.label}</div>
      <div class="day-sub">${plan.sub}</div>
      <div class="note-box">${plan.warmup}</div>
      ${exHTML}
      <div class="note-box">${plan.cooldown}</div>
    `;

    container.querySelectorAll(".set-box").forEach(box=>{
      box.addEventListener("click", async ()=>{
        const key = box.dataset.setkey;
        const idx = data.completedSets.indexOf(key);
        if(idx>-1) data.completedSets.splice(idx,1);
        else data.completedSets.push(key);
        box.classList.toggle("done");
        checkDayCompletion(plan, data, dateStr);
        await saveDay(dateStr);
        renderCalendar();
      });
    });

    container.querySelectorAll(".rest-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> startTimer(parseInt(btn.dataset.rest)));
    });

  } else {
    const mobilityHTML = plan.mobility ? plan.mobility.map(ex=>{
      const setsHTML = Array.from({length: ex.sets}).map((_,i)=>{
        const setKey = `${ex.id}-${i}`;
        const done = data.completedSets.includes(setKey);
        return `<div class="set-box ${done?'done':''}" data-setkey="${setKey}"></div>`;
      }).join("");
      return `
        <div class="exercise-card">
          <div class="ex-top">
            <div class="ex-icon">${iconSVG(ex.icon,28)}</div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-target">${ex.target}</div>
          </div>
          ${ex.how ? `<div class="ex-how">${ex.how}</div>` : ""}
          <div class="ex-bottom">
            <div class="sets">${setsHTML}</div>
            <button class="rest-btn" data-rest="30">REST 30s</button>
          </div>
        </div>`;
    }).join("") : "";

    container.innerHTML = `
      <div class="day-title">${plan.label}</div>
      <div class="day-sub">${plan.sub}</div>
      <div class="note-box">${plan.note}</div>
      ${mobilityHTML}
      <div class="walk-block">
        ${iconSVG("walk",64)}
        <button class="big-check ${data.dayComplete?'done':''}" id="walkCheck">
          ${data.dayComplete ? "✓ DONE FOR TODAY" : "MARK COMPLETE"}
        </button>
      </div>
    `;

    container.querySelectorAll(".set-box").forEach(box=>{
      box.addEventListener("click", async ()=>{
        const key = box.dataset.setkey;
        const idx = data.completedSets.indexOf(key);
        if(idx>-1) data.completedSets.splice(idx,1);
        else data.completedSets.push(key);
        box.classList.toggle("done");
        await saveDay(dateStr);
      });
    });
    container.querySelectorAll(".rest-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> startTimer(parseInt(btn.dataset.rest)));
    });

    document.getElementById("walkCheck").addEventListener("click", async ()=>{
      data.dayComplete = !data.dayComplete;
      await saveDay(dateStr);
      renderAll();
      if(data.dayComplete) showToast("NICE WORK!");
    });
  }
}

function checkDayCompletion(plan, data, dateStr){
  const totalSets = plan.exercises.reduce((sum,ex)=>sum+ex.sets,0);
  const wasComplete = data.dayComplete;
  data.dayComplete = data.completedSets.length >= totalSets;
  if(data.dayComplete && !wasComplete){
    showToast("DAY COMPLETE!");
  }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

function renderAll(){
  renderCalendar();
  renderDay();
}

// ---------- Rest timer ----------
let timerInterval = null;
function startTimer(seconds){
  const overlay = document.getElementById("timerOverlay");
  const numEl = document.getElementById("timerNum");
  const bar = document.getElementById("timerBar");
  let remaining = seconds;
  overlay.classList.add("show");
  numEl.textContent = remaining;
  bar.style.width = "100%";

  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    remaining--;
    numEl.textContent = Math.max(remaining,0);
    bar.style.width = Math.max((remaining/seconds)*100,0) + "%";
    if(remaining<=0){
      clearInterval(timerInterval);
      beep();
      overlay.classList.remove("show");
    }
  }, 1000);
}
document.getElementById("timerSkip").addEventListener("click", ()=>{
  clearInterval(timerInterval);
  document.getElementById("timerOverlay").classList.remove("show");
});

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = 660;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
  }catch(e){}
}

// ---------- Nav ----------
document.getElementById("prevDay").addEventListener("click", ()=>{
  selectedDow = (selectedDow + 6) % 7;
  renderAll();
});
document.getElementById("nextDay").addEventListener("click", ()=>{
  selectedDow = (selectedDow + 1) % 7;
  renderAll();
});
document.getElementById("resetBtn").addEventListener("click", async ()=>{
  const dateStr = currentDateStrForDow(selectedDow);
  weekData[dateStr] = {completedSets:[], dayComplete:false};
  await saveDay(dateStr);
  renderAll();
});

// ---------- Init ----------
(async function init(){
  await loadWeek();
  renderAll();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
